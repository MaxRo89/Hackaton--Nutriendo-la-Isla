[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutriendo-la-isla-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "Flask-SQLAlchemy>=3.1,<4", "Flask-Migrate>=4,<5", "python-dotenv>=1,<2", "Flask-Login>=0.6,<1", "Flask-WTF>=1.2,<2", "google-generativeai>=0.8,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
